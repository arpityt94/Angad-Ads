name: Build site
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: unzip -q *.zip -d app
      - run: npm pkg delete devDependencies.esbuild devDependencies.tsx devDependencies.autoprefixer
        working-directory: app
      - run: npm install --legacy-peer-deps
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: angad-ads-dist
          path: app/dist
